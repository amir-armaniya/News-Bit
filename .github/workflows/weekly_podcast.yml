name: Strategic Analysis Assistant

on:
  schedule:
    - cron: '0 7 * * 1'

  workflow_dispatch:
    inputs:
      on_demand_input:
        description: 'URL or command from Telegram bot'
        required: false
        default: ''

# FIX 1: Permissions moved to the top level for correct scope
permissions:
  contents: write

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run On-Demand Analysis
        if: github.event.inputs.on_demand_input != ''
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ON_DEMAND_INPUT: ${{ github.event.inputs.on_demand_input }}
        run: python on_demand_analyzer.py

      - name: Run Scheduled Weekly Analysis
        if: github.event.inputs.on_demand_input == ''
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit and push memory file
        if: success() && github.event.inputs.on_demand_input == ''
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions-bot@github.com'
          if [ -f processed_articles.jsonl ]; then
            git add processed_articles.jsonl
            # FIX 2: Only commit if there are actual changes
            if ! git diff --staged --quiet; then
              git commit -m "Update processed articles memory"
              git push
            else
              echo "No changes to commit in memory file."
            fi
          else
            echo "No memory file to commit."
          fi